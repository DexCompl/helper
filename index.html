<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dexcompl</title>
    <style>
        /* Убираем стандартные отступы браузера */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* Делаем фон белым, а шрифт черным (чтобы было видно) */
        body {
            background-color: #ffffff;
            color: #000000;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
        }

        /* Настройка верхней панели с названием */
        header {
            text-align: center; /* Выравнивание по центру */
            padding: 30px 20px; /* Отступы сверху/снизу и по бокам */
            border-bottom: 2px solid #e0e0e0; /* Тонкая серая линия под названием (для красоты) */
        }

        /* Настройка самого текста "Dexcompl" */
        h1 {
            font-size: 3rem; /* Размер шрифта */
            font-weight: bold; /* Жирный шрифт */
            letter-spacing: 2px; /* Расстояние между буквами */
            color: #333333; /* Темно-серый цвет текста */
        }
    </style>
</head>
<body>

    <!-- Верхняя часть с названием -->
    <header>
        <h1>Dexcompl</h1>
    </header>

</body>
</html>
